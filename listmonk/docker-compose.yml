version: "3.7"

services:

  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: listmonk_app_1
      APP_PORT: 9000
      PROXY_AUTH_ADD: "false"

  app:
    image: listmonk/listmonk:v6.2.0
    container_name: listmonk_app_1
    restart: unless-stopped
    hostname: listmonk.cango.io
    command: [sh, -c, "./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && ./listmonk --config ''"]
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_app__root_url: https://listmonk.cango.io/
      LISTMONK_db__host: listmonk_db_1
      LISTMONK_db__port: 5432
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: listmonk
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      LISTMONK_db__max_open: 25
      LISTMONK_db__max_idle: 25
      LISTMONK_db__max_lifetime: 300s
      TZ: Europe/Madrid
    volumes:
      - ${APP_DATA_DIR}/data/uploads:/listmonk/uploads:rw
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: listmonk_db_1
    restart: unless-stopped
    environment:
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: listmonk
      POSTGRES_DB: listmonk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
